name: Public RSS Live Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/rss-navigation-compat
    paths:
      - "scripts/check-public-rss-feeds.py"
      - "Tests/LegadoCoreTests/Fixtures/RealWorldRSS/**"
      - ".github/workflows/rss-live-smoke.yml"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: public-rss-live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check public RSS feeds
        run: python3 scripts/check-public-rss-feeds.py
